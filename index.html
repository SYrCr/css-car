<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Машинка на CSS</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; }
.scene {
  position: relative; width: 100%; height: 100vh; height: 100dvh;
  min-height: 380px; overflow: hidden;
  background:
    radial-gradient(circle at 77% 18%, #fff7d6 0 44px, #ffe492 45px 58px, transparent 59px),
    radial-gradient(ellipse at 12% 91%, #9ecab5 0 31%, transparent 31.2%),
    radial-gradient(ellipse at 77% 97%, #91c6ac 0 35%, transparent 35.2%),
    linear-gradient(to bottom, #8ed7ee 0%, #d1f2f6 68%, #c5e0c5 100%);
}
.scene::after {
  content: ""; position: absolute; z-index: 0; inset: auto 0 0; height: 180px;
  border-top: 8px solid #d7dfe0;
  background:
    repeating-linear-gradient(90deg, #f8e7af 0 62px, transparent 62px 137px)
      center 57% / 100% 8px no-repeat,
    linear-gradient(180deg, #4c6071, #2d3c4b);
  box-shadow: 0 -8px 0 #6e9e7a;
}
.car {
  position: absolute; z-index: 1; left: -200px; bottom: 200px;
  width: 200px; height: 58px; border: 3px solid #bc671f;
  border-radius: 17px 30px 13px 13px;
  background: linear-gradient(180deg, #ffdf75, #ffb746 45%, #f18a29);
  box-shadow: inset 0 4px 0 #fff6b0, 0 10px 14px #1d34413d;
  animation: drive 5s cubic-bezier(.34, .04, .15, 1) forwards;
}
.car::before {
  content: ""; position: absolute; left: 35px; bottom: calc(100% - 1px);
  width: 132px; height: 48px; border: 6px solid #e89334; border-bottom: 0;
  border-radius: 55px 50px 0 0;
  background: linear-gradient(90deg, #b6e8fa 0 48%, #e89334 48% 53%, #a1d8ed 53% 100%);
  transform: skewX(-7deg);
}
.car::after {
  content: ""; position: absolute; top: 23px; right: -3px;
  width: 11px; height: 15px; border-radius: 6px; background: #fff8d6;
  box-shadow: -188px 3px 0 -1px #e34b58, -78px -12px 0 -3px #975a2e;
}
.wheel {
  position: absolute; bottom: -22px; width: 43px; height: 43px;
  border: 5px solid #182636; border-radius: 50%;
  background:
    radial-gradient(circle, #eaf2f7 0 5px, transparent 6px),
    repeating-conic-gradient(#dce7ee 0deg 35deg, #718da0 35deg 60deg);
  box-shadow: 0 2px 0 #182636;
  animation: spin 5s ease-out forwards;
}
.wheel:first-child { left: 25px; }
.wheel:last-child { right: 24px; }
@keyframes drive { from { left: -200px; } to { left: calc(100% - 250px); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(1440deg); } }
@media (max-width: 250px) { .scene { min-width: 250px; } }
@media (prefers-reduced-motion: reduce) {
  .car, .wheel { animation-duration: .01ms; }
}
</style>
</head>
<body>
<main class="scene" aria-label="Машинка едет по дороге">
  <div class="car" role="img" aria-label="Жёлтая машина шириной 200 пикселей">
    <span class="wheel"></span><span class="wheel"></span>
  </div>
</main>
</body>
</html>
