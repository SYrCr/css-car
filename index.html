<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Машинка</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: lightblue;
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: gray;
        }

        .car {
            position: absolute;
            bottom: 110px;
            left: -200px;
            width: 200px;
            height: 50px;
            background: tomato;
            border-radius: 12px;
            animation: drive 5s forwards;
        }

        .roof {
            position: absolute;
            bottom: 45px;
            left: 40px;
            width: 110px;
            height: 45px;
            background: lightcyan;
            border: 7px solid tomato;
            border-bottom: none;
            border-radius: 30px 30px 0 0;
        }

        .wheel {
            position: absolute;
            bottom: -15px;
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
        }

        .front { right: 25px; }
        .back { left: 25px; }

        @keyframes drive {
            from { left: -200px; }
            to { left: calc(100% - 250px); }
        }
    </style>
</head>
<body>
    <div class="road"></div>
    <div class="car">
        <div class="roof"></div>
        <div class="wheel back"></div>
        <div class="wheel front"></div>
    </div>
</body>
</html>
